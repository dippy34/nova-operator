name: Nova
options:
  bundleIdPrefix: dev.nova
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGN_STYLE: Automatic
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  Nova:
    type: application
    platform: iOS
    sources:
      - path: NovaApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nova.operator
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nova
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Nova listens when you tap the mic so you can talk to it."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Nova turns what you say into text so it can act on your request."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
schemes:
  Nova:
    build:
      targets:
        Nova: all
    run:
      config: Debug
